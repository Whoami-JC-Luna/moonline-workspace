services:
  db:
    image: pgvector/pgvector:pg16
    container_name: moonline-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - moonline_pgdata:/var/lib/postgresql/data

volumes:
  moonline_pgdata:
